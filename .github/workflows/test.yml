name: test
on:
    push:
    pull_request:
jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: latest
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Install modules
              run: pnpm install
            - name: Run tsc
              run: pnpm run tsc
            - name: Run Prettier
              run: pnpm run format
            - name: Run ESLint
              run: pnpm run lint
            - name: Run tests
              run: pnpm run test
            - name: Run build
              run: pnpm run build
